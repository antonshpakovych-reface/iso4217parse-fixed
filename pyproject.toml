[project]
name = "iso4217parse-fixed"
version = "0.1.0"
description = "A fork of iso4217-parse with support only active currencies"
authors = [
    { name = "Anton Shpakovych", email = "anton.shpakovych@reface.ai" }
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["iso4217", "currency", "parse", "symbol"]
readme = "README.md"
requires-python = ">=3.9"

[project.urls]
homepage = "https://github.com/antonshpakovych-reface/iso4217parse-fixed"
repository = "https://github.com/antonshpakovych-reface/iso4217parse-fixed"


[tool.poetry]
packages = [{include = "iso4217parse"}]
include = ["iso4217parse/*.json", "iso4217parse/*.py", "setup.cfg"]
classifiers = [
    # Trove classifiers
    # Full list: https://pypi.python.org/pypi?%3Aaction=list_classifiers
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy"
]

[tool.poetry.group.dev.dependencies]
iso3166 = "*"
mypy = "*"
pytest = "*"
ruff = "*"
iso4217 = "*"

[build-system]
requires = ["poetry-core>=2.2.0"]
build-backend = "poetry.core.masonry.api"
